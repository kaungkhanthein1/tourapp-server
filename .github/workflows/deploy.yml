name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -o bin/server ./cmd/server

      - name: Generate Deployment Package
        run: |
          zip -r deploy.zip . -x "*.git*" -x "*.qodo*" -x "*.yml" -x ".env" -x "*/.env" -x "credentials/*" -x "credentials/**"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: tourapp-server
          environment_name: tourapp-server-env
          version_label: "version-${{ github.sha }}"
          use_existing_version_if_available: true
          region: ap-southeast-2
          deployment_package: deploy.zip
