basePath: /api/v1
definitions:
  admin.CreateHotelRequest:
    properties:
      country:
        type: string
      facilities:
        items:
          type: string
        type: array
      gallery_urls:
        items:
          type: string
        type: array
      image_url:
        type: string
      name:
        type: string
      place:
        type: string
      place_id:
        type: integer
      rating:
        type: number
      region:
        type: string
    required:
    - name
    - place
    type: object
  admin.InventoryRequest:
    properties:
      is_active:
        type: boolean
      total_units:
        minimum: 1
        type: integer
    required:
    - total_units
    type: object
  admin.RoomRequest:
    properties:
      capacity:
        minimum: 1
        type: integer
      description:
        type: string
      image_url:
        type: string
      is_active:
        description: nil → true on create
        type: boolean
      name:
        type: string
      price_mmk:
        minimum: 0
        type: integer
      total_units:
        minimum: 1
        type: integer
    required:
    - name
    - price_mmk
    type: object
  admin.SetRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  admin.UpdateBookingRequest:
    properties:
      check_in:
        type: string
      check_out:
        type: string
      guest_name:
        type: string
      guest_phone:
        type: string
      guests:
        type: integer
    type: object
  admin.UpdateHotelRequest:
    properties:
      country:
        type: string
      facilities:
        items:
          type: string
        type: array
      gallery_urls:
        items:
          type: string
        type: array
      image_url:
        type: string
      name:
        type: string
      place:
        type: string
      rating:
        type: number
      region:
        type: string
    type: object
  admin.UpdateStatusRequest:
    properties:
      reason:
        type: string
      status:
        type: string
    required:
    - status
    type: object
  bookings.CreateRequest:
    properties:
      check_in:
        type: string
      check_out:
        type: string
      guest_name:
        type: string
      guest_phone:
        type: string
      guests:
        minimum: 1
        type: integer
      hotel_id:
        type: integer
      payment_method:
        type: string
      room_id:
        type: integer
    required:
    - check_in
    - check_out
    - hotel_id
    - room_id
    type: object
  bookings.RescheduleRequest:
    properties:
      check_in:
        type: string
      check_out:
        type: string
    required:
    - check_in
    - check_out
    type: object
  places.AddFavoriteRequest:
    properties:
      note:
        type: string
      place_id:
        type: integer
    required:
    - place_id
    type: object
  users.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  users.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    type: object
  users.UpdateRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
info:
  contact: {}
  description: 'Travel Planning App backend — places, foods, hotels, bookings, users.
    Discovery routes are public; favorites/bookings/users require `Authorization:
    Bearer <FIREBASE_ID_TOKEN>` (Firebase ID token obtained by the mobile app via
    Firebase Auth). Legacy password auth (/users/login, /users/register) is deprecated.'
  title: Tourapp API
  version: "3.0"
paths:
  /admin/audit-logs:
    get:
      parameters:
      - description: booking | hotel | room | user
        in: query
        name: entity_type
        type: string
      - description: Filter by entity
        in: query
        name: entity_id
        type: integer
      - description: Max items (1-100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Admin action trail (every extranet mutation)
      tags:
      - admin-audit
  /admin/bookings:
    get:
      parameters:
      - description: pending | confirmed | complete | cancelled
        in: query
        name: status
        type: string
      - description: Filter by hotel
        in: query
        name: hotel_id
        type: integer
      - description: Guest name/phone/email or hotel name
        in: query
        name: q
        type: string
      - description: check_in >= from (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: check_in < to (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Max items (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: List all bookings (extranet)
      tags:
      - admin-bookings
  /admin/bookings/{id}:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Get one booking
      tags:
      - admin-bookings
    patch:
      consumes:
      - application/json
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Partial update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Edit guest fields/dates of a pending or confirmed booking
      tags:
      - admin-bookings
  /admin/bookings/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: status + optional reason (audited)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Transition a booking status (pending→confirmed/cancelled, confirmed→complete/cancelled)
      tags:
      - admin-bookings
  /admin/hotels:
    get:
      parameters:
      - description: Name/place search
        in: query
        name: q
        type: string
      - description: Max items (1-100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: List hotels with room/active-booking counts
      tags:
      - admin-hotels
    post:
      consumes:
      - application/json
      parameters:
      - description: Hotel
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CreateHotelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Create a hotel
      tags:
      - admin-hotels
  /admin/hotels/{id}:
    delete:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Delete a hotel (409 while any booking references it)
      tags:
      - admin-hotels
    get:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Get a hotel with its rooms
      tags:
      - admin-hotels
    patch:
      consumes:
      - application/json
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Partial update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateHotelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Patch a hotel (supplied fields only)
      tags:
      - admin-hotels
  /admin/hotels/{id}/rooms:
    post:
      consumes:
      - application/json
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.RoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Add a room type to a hotel
      tags:
      - admin-hotels
  /admin/hotels/{id}/rooms/{rid}:
    delete:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room ID
        in: path
        name: rid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Delete a room (409 when bookings reference it — deactivate instead)
      tags:
      - admin-hotels
    patch:
      consumes:
      - application/json
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room ID
        in: path
        name: rid
        required: true
        type: integer
      - description: Room
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.RoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Patch a room
      tags:
      - admin-hotels
  /admin/hotels/{id}/rooms/{rid}/inventory:
    put:
      consumes:
      - application/json
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room ID
        in: path
        name: rid
        required: true
        type: integer
      - description: Inventory
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.InventoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Set room allotment (total_units) and stop-sell (is_active)
      tags:
      - admin-hotels
  /admin/stats/occupancy:
    get:
      parameters:
      - description: YYYY-MM-DD inclusive
        in: query
        name: from
        required: true
        type: string
      - description: YYYY-MM-DD exclusive
        in: query
        name: to
        required: true
        type: string
      - description: Limit to one hotel
        in: query
        name: hotel_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Per-night occupancy for [from, to) — same checkout-exclusive semantics
        as the booking constraint
      tags:
      - admin-stats
  /admin/stats/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Dashboard counters (bookings by status, revenue, catalog, users)
      tags:
      - admin-stats
  /admin/users:
    get:
      parameters:
      - description: Name/email search
        in: query
        name: q
        type: string
      - description: user | admin
        in: query
        name: role
        type: string
      - description: Max items (1-100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: List users with booking counts
      tags:
      - admin-users
  /admin/users/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.SetRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminAuth: []
      summary: Promote/demote a user (DB role is the revocable source of truth)
      tags:
      - admin-users
  /bookings:
    get:
      parameters:
      - description: pending | complete | cancelled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Booking history for the current user (Pending/Complete tabs)
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: 'Confirms instantly: payment is settled at the property, so the
        booking is created with status=''confirmed''. Omit payment_method or pass
        ''pay_at_property''; any other value returns 400 until an online gateway exists.'
      parameters:
      - description: hotel_id, room_id, check_in, check_out, payment_method (optional,
          default pay_at_property)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Book a hotel room — pay-at-property, born confirmed (409 when sold
        out)
      tags:
      - bookings
  /bookings/{id}/cancel:
    patch:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a pending booking
      tags:
      - bookings
  /bookings/{id}/reschedule:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: new check_in / check_out
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/bookings.RescheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reschedule a pending booking
      tags:
      - bookings
  /favorites:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List favorited places for the current user
      tags:
      - favorites
    post:
      consumes:
      - application/json
      parameters:
      - description: place_id required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/places.AddFavoriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Favorite a place
      tags:
      - favorites
  /favorites/{placeId}:
    delete:
      parameters:
      - description: Place ID
        in: path
        name: placeId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove a favorite
      tags:
      - favorites
  /foods:
    get:
      parameters:
      - description: true for popular only
        in: query
        name: popular
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Food recommendations ("Foods You Should Try")
      tags:
      - places
  /hotels:
    get:
      description: 'Supports filters: place, q; paginated via limit/offset. Serves
        preset (seeded) data only.'
      parameters:
      - description: Place name
        in: query
        name: place
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Max items (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List hotels ( Hotels tab)
      tags:
      - hotels
  /hotels/{id}:
    get:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Hotel detail with facilities and rooms
      tags:
      - hotels
  /hotels/{id}/availability:
    get:
      description: 'Per-room free units over [check_in, check_out): units_booked is
        the peak concurrent active holds on any single night; bookable=false when
        sold out or stop-sold (is_active=false).'
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: YYYY-MM-DD (inclusive)
        in: query
        name: check_in
        required: true
        type: string
      - description: YYYY-MM-DD (exclusive)
        in: query
        name: check_out
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Real-time room availability for a date window
      tags:
      - hotels
  /hotels/{id}/rooms:
    get:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Rooms with MMK pricing
      tags:
      - hotels
  /places:
    get:
      description: 'Supports filters: category, q (search), popular, trending; paginated
        via limit/offset.'
      parameters:
      - description: Category name
        in: query
        name: category
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: true|false
        in: query
